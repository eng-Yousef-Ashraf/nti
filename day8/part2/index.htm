<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Posts Manager</h1>


    <!-- ================= CREATE ================= -->
    <section class="section">
        <h2>Add New Post</h2>
        <form id="addForm">
            <input
                type="text"
                id="title"
                placeholder="Post title"
                required
            >
            <textarea
                id="body"
                placeholder="Post body"
                required
            ></textarea>
            <button type="submit">
                Add Post
            </button>
        </form>
    </section>


    <!-- ================= UPDATE ================= -->
    <section class="section">
        <h2>Update Post</h2>
        <input
            type="number"
            id="updateId"
            placeholder="Post ID"
        >
        <input
            type="text"
            id="updateTitle"
            placeholder="New title"
        >
        <textarea
            id="updateBody"
            placeholder="New body"
        ></textarea>
        <button id="updateBtn">
            Update Post
        </button>
    </section>


    <!-- ================= DELETE ================= -->
    <section class="section">
        <h2>Delete Post</h2>
        <div class="delete-box">
            <input
                type="number"
                id="deleteId"
                placeholder="Enter Post ID"
            >
            <button id="deleteBtn">
                Delete Post
            </button>
        </div>
    </section>


    <!-- ================= POSTS ================= -->
    <section class="section">
        <div class="posts-header">
            <h2>Posts</h2>
            <button id="loadBtn">
                Load Posts
            </button>
        </div>
        <div id="postsContainer"></div>
    </section>
    <script src="external.js"></script>
</body>
</html>
